# freeclash 配置示例
# 保存为 config.yaml 后，用 freeclash -config config.yaml 启动
# 命令行参数（-site / -button / -url / -top / -interval / -serve / -out / -concurrency）会覆盖此处同名配置

# 分享站点首页。配置后程序会自己从页面解析出「精选订阅」地址，
# 不必再手动点网页上的「复制精选订阅」。需要与 subscriptions 二选一或同时使用。
site: https://freeclash.zhaotizi.best/

# 页面上那个按钮的文案，用于定位订阅地址所在的 JS 模块。
# 站点改文案时改这里即可。
site_button: 复制精选订阅

# 首页的「查看节点文章」指向当天的每日汇总页，页面里挂着几十条「通用订阅」，
# 节点数量远多于首页那份精选订阅。默认只跟当天这一篇：往期文章里的订阅隔天
# 基本失效，多抓的边际收益很低（实测 1 篇 31 个可用、3 篇 41 个，耗时翻倍）。
# 0 表示只探测精选订阅。
article_limit: 1
# 每轮从文章里收集的订阅总数上限（0 表示不限）
article_max_subs: 100
# 拉取这些订阅的并发数
article_concurrency: 8
# 合并去重后的节点上限，0 表示不限。节点过多导致单轮耗时过长时可用它截断。
max_nodes: 0
# 每条订阅的原始响应会按地址分别缓存到 output_dir/sub-cache/（gzip）。
# 某条源被限流（GitHub Pages 常整片 403）、超时或返回半截时，用它上次拉到的
# 内容继续供节点；否则几十条订阅挂掉几条，节点池就会缩水两三成。
# 这里是缓存的有效期：免费订阅每天换一批节点，超过半天以上的快照里活节点
# 已经寥寥。填 0 关闭缓存。
sub_cache_ttl: 12h

# 订阅来源。可填多个，支持 http(s) 与本地文件路径。
# 与 site 同时配置时结果会合并去重；任一源失败不影响其他源；
# 全部失败时回退到上次解析出的地址，再失败则用 output_dir 下的缓存。
subscriptions: []

# 探测目标。该地址需返回 200 或 204，建议使用境外站点，
# 这样一次请求即可同时验证 DNS、TLS 与出境链路是否真正可用。
probe_url: https://www.gstatic.com/generate_204

# ---- 时间与并发 ----
# TCP 预筛超时：只做三次握手，足够淘汰不可达节点
pre_timeout: 2s
# 单个节点的完整探测超时（建连 + 协议握手 + 境外 TLS + HTTP 往返）
probe_timeout: 6s
# 预筛并发与探测并发
pre_concurrency: 256
concurrency: 96

# ---- 采样策略 ----
# 全部节点的初测轮数。1 轮最快；网络抖动大时可设为 2。
rounds: 1
# 对排名靠前的候选（前 top_n*2 个）追加的复测轮数，用于压低延迟噪声
refine_rounds: 3
# 最终输出到订阅文件中的节点数量
top_n: 30
# 单一订阅来源最多占 top_n 的比例。节点按来源分配名额，避免可用节点集中的大订阅
# 把名额占满、其它来源的可用节点被截断。填 1 表示不限（回到纯延迟排序取前 N）。
source_cap_ratio: 0.5

# ---- 下载测速 ----
# 对候选节点在隧道内实拉一段数据，按吞吐排序。延迟只反映握手开销，和带宽没有必然
# 关系；免费节点里「延迟高但速度好」很常见，关掉测速就会按延迟挑到慢节点。
speedtest: true
speedtest_url: "https://speed.cloudflare.com/__down?bytes=2000000"
# 单个节点的下载窗口，到点按已下载量折算速率，慢节点不会拖住整轮
speedtest_timeout: 5s
# 同时测速的节点数，太大会互相抢带宽把结果压低
speedtest_concurrency: 6

# ---- 过滤 ----
# 只保留名称命中这些关键字的节点（留空表示不限制）
include: []
# 排除名称命中这些关键字的节点，例如 ["RELAY", "过期"]
exclude: []

# ---- 输出 ----
output_dir: out
# 开启本地订阅服务后，把 Clash 订阅地址填成 http://127.0.0.1:9898/best.yaml 即可。
# 写成 "127.0.0.1:9898" 只监听本机；写成 ":9898" 会监听所有网卡，局域网内可访问。
serve_addr: "127.0.0.1:9898"
# 定时探测间隔。设为 0 表示只执行一次
interval: 30m
# 按地区生成测速分组的最大数量，0 表示不生成地区分组
per_region_groups: 6

# 日志文件。留空时：服务模式写 <配置目录>/logs/freeclash.log（超过 10MB 轮转，保留 5 份），
# 前台模式直接输出到终端。安装为系统服务后没有终端，日志只能看文件。
log_file: ""

# 忽略节点侧 TLS 证书错误。免费节点普遍使用自签证书，建议保持 true。
insecure: true
